name: routeiq
description: RouteIQ offline-first fleet management and AI routing application.
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  path_provider: ^2.1.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  uuid: ^4.5.3
  geolocator: ^14.0.3
  supabase_flutter: ^2.8.0
  flutter_svg: ^2.0.17
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
